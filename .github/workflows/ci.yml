name: CI

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    env:
      CFDC_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile checks run --build --rm python-check
      - run: git diff --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile checks run --build --rm frontend-check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build app
      - run: docker compose -p cfdc-ci up --no-build --wait -d app
      - run: docker compose -p cfdc-ci exec -T app python main.py --doctor
      - run: docker compose -p cfdc-ci exec -T app python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:7860/').status == 200"
      - if: always()
        run: docker compose -p cfdc-ci down --volumes --remove-orphans
