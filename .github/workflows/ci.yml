name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
      - run: uv run --locked python main.py --benchmark > /tmp/cfdc-benchmark.json
      - run: uv run --locked python main.py --validate-demo

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cfdc/web/frontend/package-lock.json
      - run: uv sync --locked
      - run: npm --prefix cfdc/web/frontend ci
      - run: npm --prefix cfdc/web/frontend run format:check
      - run: npm --prefix cfdc/web/frontend run typecheck
      - run: npm --prefix cfdc/web/frontend run lint
      - run: npm --prefix cfdc/web/frontend test
      - run: npm --prefix cfdc/web/frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: cfdc/web/frontend
      - run: npm --prefix cfdc/web/frontend run test:e2e
