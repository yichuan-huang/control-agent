[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdc-control"
version = "0.1.0"
description = "Independent Core-Feature-Driven Control framework"
requires-python = ">=3.11"
dependencies = [
  "gradio>=6.0,<7",
  "numpy>=2.0",
  "openai>=1.0",
  "pydantic>=2.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10",
]

[tool.setuptools.packages.find]
include = ["cfdc*"]
exclude = ["archive*"]

[tool.setuptools.package-data]
cfdc = ["diagnosis/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
