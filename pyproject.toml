[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdc-control"
version = "0.3.8"
description = "Independent Core-Feature-Driven Control framework"
authors = [{ name = "Yichuan Huang" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.20",
  "numpy>=2.0",
  "openai>=1.0",
  "pydantic>=2.0",
  "pypdf>=5.0",
  "python-multipart>=0.0.18,<1",
  "plotly>=5.24,<7",
  "scipy>=1.14",
  "sentence-transformers>=3.0",
  "uvicorn>=0.34,<1",
]

[project.urls]
Repository = "https://github.com/yichuan-huang/control-agent"

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
  "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["cfdc*"]
exclude = ["archive*", "cfdc.web.frontend*", "cfdc.web.gradio_archive*"]

[tool.uv]
python-preference = "only-managed"

[tool.setuptools.package-data]
cfdc = [
  "knowledge/resources/*.json",
  "kernel/resources/*.json",
  "history/resources/*.json",
  "resources/knowledge_pack/v1/*.json",
  "resources/knowledge_pack/v1/cards/en/*.md",
  "resources/knowledge_pack/v1/cards/zh/*.md",
  "resources/knowledge_pack/v1/eval/*.json",
]

[tool.setuptools.exclude-package-data]
"cfdc.web" = ["frontend/*", "frontend/**/*", "gradio_archive/*", "gradio_archive/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["cfdc/web/gradio_archive", "node_modules"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["cfdc/web/gradio_archive", "cfdc/web/frontend/node_modules", "cfdc/web/frontend/dist"]

[tool.ruff.lint]
# These input-validation boundaries intentionally expose malformed payloads as
# ValueError for a stable public/API and Pydantic validation contract.
[tool.ruff.lint.per-file-ignores]
"cfdc/web/service.py" = ["TRY004"]
