[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdc-control"
version = "0.1.0"
description = "Independent Core-Feature-Driven Control framework"
authors = [{ name = "Yichuan Huang" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "gradio>=6.0,<7",
  "numpy>=2.0",
  "openai>=1.0",
  "pandas>=2.2",
  "pydantic>=2.0",
  "scipy>=1.14",
]

[project.urls]
Repository = "https://github.com/yichuan-huang/control-agent"

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10",
]

[tool.setuptools.packages.find]
include = ["cfdc*"]
exclude = ["archive*"]

[tool.setuptools.package-data]
cfdc = ["diagnosis/*.json", "lab/resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
