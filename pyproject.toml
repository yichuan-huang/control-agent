[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdc-control"
version = "0.3.0"
description = "Independent Core-Feature-Driven Control framework"
authors = [{ name = "Yichuan Huang" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "gradio>=6.0,<7",
  "jsonschema>=4.20",
  "numpy>=2.0",
  "openai>=1.0",
  "pandas>=2.2",
  "pydantic>=2.0",
  "plotly>=5.24,<7",
  "scipy>=1.14",
]

[project.optional-dependencies]
rag = ["pypdf>=5.0", "sentence-transformers>=3.0"]

[project.urls]
Repository = "https://github.com/yichuan-huang/control-agent"

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
  "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["cfdc*"]
exclude = ["archive*"]

[tool.uv]
python-preference = "only-managed"

[tool.setuptools.package-data]
cfdc = ["diagnosis/*.json", "lab/resources/*.json", "kernel/resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# These input-validation boundaries intentionally expose malformed payloads as
# ValueError for a stable public/API and Pydantic validation contract.
[tool.ruff.lint.per-file-ignores]
"cfdc/controllers/synthesis.py" = ["TRY004"]
"cfdc/diagnosis/llm.py" = ["TRY004"]
"cfdc/diagnosis/mechanism_cards.py" = ["TRY004"]
"cfdc/lab/controller_compatibility.py" = ["TRY004"]
"cfdc/lab/model_contracts.py" = ["TRY004"]
"cfdc/lab/model_discovery_llm.py" = ["TRY004"]
"cfdc/sim/closed_loop_runtime.py" = ["TRY004"]
"cfdc/sim/profile_runtime.py" = ["TRY004"]
"cfdc/specifications/compiler.py" = ["TRY004"]
"cfdc/specifications/dialogue.py" = ["TRY004"]
"cfdc/web/service.py" = ["TRY004"]
